<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nura Auto Clicker - Secure Payment</title>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            background-color: #0d121f;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40px;
            padding-left: 16px;
            padding-right: 16px;
        }
        .card {
            background: #151d30;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            padding: 14px 28px;
            background: #10b981;
            color: #030712;
            border: none;
            font-size: 16px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="planTitle" style="color: #10f59b; margin-bottom: 8px;">Nura Auto Clicker</h2>
        <p id="planDesc" style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">Secure UPI Payment (GPay, PhonePe, Paytm)</p>
        
        <button class="btn" id="payBtn" onclick="payNow()">Pay Now</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userid') || 'guest_user';
        const planName = urlParams.get('plan') || '1 Day Test';
        const amountRs = parseInt(urlParams.get('amount')) || 1;
        const planDays = parseInt(urlParams.get('days')) || 1;

        document.getElementById('planTitle').innerText = "Nura Auto Clicker - " + planName;
        document.getElementById('planDesc').innerText = "₹" + amountRs + " UPI Payment (GPay, PhonePe, Paytm)";
        document.getElementById('payBtn').innerText = "Pay ₹" + amountRs + " Now";

        const FIREBASE_URL = "https://nuraautoclicker-default-rtdb.firebaseio.com";

        function getFirebaseEmailKey(email) {
            if (!email) return "";
            return email.trim().toLowerCase().replace(/[^a-zA-Z0-9]/g, "_");
        }

        function payNow() {
            var amountInPaise = amountRs * 100;

            var options = {
                "key": "rzp_live_TkCzwpVw5zuPVu",
                "amount": amountInPaise, 
                "currency": "INR",
                "name": "Nura Auto Clicker",
                "description": planName + " - User: " + userId,
                "handler": function (response){
                    updateFirebaseActivation(response.razorpay_payment_id);
                },
                "theme": {
                    "color": "#10b981"
                }
            };
            var rzp = new Razorpay(options);
            rzp.open();
        }

        function updateFirebaseActivation(paymentId) {
            var emailKey = getFirebaseEmailKey(userId);
            if (!emailKey || emailKey === 'guest_user') {
                alert("Error: Invalid User ID!");
                return;
            }

            var nowMs = Date.now();
            var expiryMs = nowMs + (planDays * 24 * 60 * 60 * 1000);

            var activationData = {
                status: "APPROVED",
                approved: true,
                isApproved: true,
                plan: planName,
                planAmount: amountRs,
                planDays: planDays,
                expiryDate: expiryMs,
                subscriptionStartedAt: nowMs,
                razorpayPaymentId: paymentId,
                paymentStatus: "CAPTURED",
                allowArea: true,
                allowPrice: true
            };

            fetch(FIREBASE_URL + "/users/" + emailKey + ".json", {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(activationData)
            })
            .then(res => res.json())
            .then(data => {
                alert("🎉 Payment Successful & Account Approved!\n\nKindly return to the Nura Auto Clicker app, and tap 'CHECK APPROVAL STATUS' to enter.");
            })
            .catch(err => {
                alert("Payment saved, but Firebase sync error: " + err);
            });
        }
    </script>
</body>
</html>
