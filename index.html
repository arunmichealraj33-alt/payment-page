<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto JX Pro - Secure Payment</title>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .btn {
            padding: 15px 35px;
            background: #00C853;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Auto JX Pro - Premium Activation</h2>
    <p>₹1 UPI Payment (GPay, PhonePe, Paytm)</p>
    
    <button class="btn" onclick="payNow()">Pay ₹1 Now</button>

    <script>
        // URL-ல் இருந்து User ID-ஐ பெற்றுக்கொள்ளும் வசதி
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userid') || 'guest_user';

        function payNow() {
            var options = {
                "key": "rzp_live_TkCzwpVw5zuPVu", // உங்களது லைவ் கீ
                "amount": "100", // ₹1 (100 Paisa)
                "currency": "INR",
                "name": "Auto JX Pro",
                "description": "User ID: " + userId,
                "handler": function (response){
                    alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
                    
                    if(window.AutoJS) {
                        window.AutoJS.onPaymentSuccess(response.razorpay_payment_id);
                    }
                },
                "theme": {
                    "color": "#00C853"
                }
            };
            var rzp = new Razorpay(options);
            rzp.open();
        }
    </script>
</body>
</html>
